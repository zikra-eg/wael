<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البيت</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1a1f;--wall:#15323a;--off:#0a1519;--lamp:#ffc76a;--ink:#f6ecd8;--btn-ink:#2a1700;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe6d2;--wall:#2b4a52;--off:#18292e;--lamp:#e69a1f;--ink:#25201a;color-scheme:light}}
:root[data-theme="light"]{--bg:#efe6d2;--wall:#2b4a52;--off:#18292e;--lamp:#e69a1f;--ink:#25201a;color-scheme:light}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--lamp) 16%,var(--bg)),var(--bg) 65%);color:var(--ink);font-family:"Amiri","Noto Naskh Arabic",Georgia,serif;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:30rem;padding:1.6rem 1.4rem 3rem;text-align:center}
svg{width:min(78vw,19.5rem);height:auto;overflow:visible;display:block;margin:1.4rem auto 1.4rem}
#wall{fill:var(--wall);stroke:var(--lamp);stroke-width:1;stroke-opacity:.35;transition:fill-opacity 2s,stroke-opacity 2s,stroke-width 2s}
.lt{fill:var(--off);stroke:var(--lamp);stroke-opacity:.25;stroke-width:.8;transition:fill 1.2s,opacity 2s,filter 1.2s}
.lt.on{fill:var(--lamp);stroke-opacity:1;filter:drop-shadow(0 0 6px var(--lamp)) drop-shadow(0 0 14px color-mix(in srgb,var(--lamp) 55%,transparent))}
#photo{opacity:0;transition:opacity 2.5s}
.done #photo{opacity:1}
.done #wall{fill-opacity:0;stroke-opacity:1;stroke-width:2.4}
.done .lt{opacity:0}
.dots{display:flex;gap:.4rem;justify-content:center;margin-bottom:1.1rem}
.dots i{width:.5rem;height:.5rem;border-radius:50%;border:1.5px solid var(--lamp);transition:background .5s}
.dots i.f{background:var(--lamp)}
.panel{min-height:13rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
.msg{font-size:1.28rem;line-height:2.05;margin:0 0 1.5rem;transition:opacity .45s}
.msg.out{opacity:0}
h2{font-size:2.2rem;margin:.2rem 0 1.2rem;font-weight:700}
.cap{color:var(--lamp);font-size:1.25rem;margin:0 0 .4rem}
button{font-family:"Tajawal",system-ui,sans-serif;font-size:1.05rem;font-weight:700;border-radius:999px;padding:.85rem 2.2rem;min-width:13rem;cursor:pointer;border:2px solid var(--lamp);background:var(--lamp);color:var(--btn-ink)}
button.ghost{background:transparent;color:var(--lamp)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:active{transform:scale(.97)}
.row{display:flex;flex-direction:column;gap:.8rem;align-items:center}
.reply{margin-top:1.6rem;font-size:1.3rem;line-height:2}
[hidden]{display:none!important}
.heart{position:fixed;bottom:-2rem;font-size:1.6rem;pointer-events:none;animation:up 4s ease-in forwards}
@keyframes up{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){#wall,.lt,#photo,.msg{transition:none}.heart{animation:none}}
</style>
</head>

<script>
(function(){
  var T=[
   "أنا عارفة إن الفترة اللي فاتت ما كانتش سهلة علينا، وإن المشاكل بينا بقت كتير، ويمكن كل واحد فينا بقى متمسك برأيه ومستني التاني هو اللي يبدأ.",
   "أنا عارفة إن عنادي ساعات بيخليني أتمسك بكلام أو مواقف مش مستاهلة، وإن فضولي وتدخلي في تفاصيل كتير ممكن يكونوا بيضايقوك، ويمكن ساعات بتكون محتاج مساحة وهدوء وأنا مش بقدر أفهم ده.",
   "مش بقول الكلام ده عشان أبرر لنفسي، لكن عشان أقولك إني مدركة إن في حاجات محتاجة تتغير.",
   "أنا مش عايزة حياتنا تبقى مجرد كلمة على قد الكلمة، وكل واحد فينا عايش في ناحية لوحده، ولا عايزة السكوت والبعد يبقوا هما الحل كل ما نختلف.",
   "إحنا مش صغيرين، وعندنا سنين وعشرة وبيت وأولاد، ونفسي البيت ده يبقى مكان فيه راحة وأمان، مش مكان كل واحد فيه مستني المشكلة الجاية.",
   "أنا مش بطلب إننا نبقى متفقين في كل حاجة، ولا إن واحد فينا يلغي شخصيته عشان التاني، لكن نفسي نتعلم نختلف من غير ما نجرح بعض، ونتكلم من غير عناد، ونسمع بعض من غير ما كل واحد يكون مجهز ردّه.",
   "أنا مش عايزة أولادنا يشيلوا أثر خلافاتنا معاهم في حياتهم، ونفسي يشوفوا إن أبوهم وأمهم حتى لو اختلفوا، يقدروا يحافظوا على بيتهم واحترامهم لبعض.",
   "يمكن أنا مش بعرف أعبّر عن اللي جوايا بالطريقة الصح، ويمكن قصرت في حاجات كتير، لكن نفسي ندي لنفسنا فرصة نعيش بهدوء ونصلح اللي باظ بينا.",
   "مش عايزة نفضل نثبت مين الصح ومين الغلط، أنا عايزة نكسب بعض، ونحس إننا لسه أسرة واحدة."
  ];
  var W=[[20,132,26,30],[154,132,26,30],[52,132,26,30],[122,132,26,30],[22,92,28,28],[148,92,28,28],[64,92,28,28],[106,92,28,28]];

    if(n<T.length){
      lt[n].classList.add("on");D.children[n].classList.add("f");say(T[n]);n++;
      btn.textContent=n<T.length?"كمّل":"خلّصت";

      document.getElementById("house").classList.add("done");
      document.getElementById("step").hidden=true;
      setTimeout(function(){document.getElementById("ask").hidden=false;},1400);
    }
  });
  var reply=document.getElementById("reply");
  function show(t){reply.textContent=t;reply.hidden=false;}
  document.getElementById("wait").addEventListener("click",function(){show("خد وقتك، وأنا هنا، ومش هضغط عليك.");});
  document.getElementById("yes").addEventListener("click",function(){
    show("يلا نبدأ، خطوة خطوة، وبهدوء.");

      document.body.appendChild(x);setTimeout(function(){x.remove();},6000);
    },j*140);})(j);}
  });
})();
